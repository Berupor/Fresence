name: Bug
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: App or agent version, from Settings or `fresence version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Linux, Windows or Android
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
